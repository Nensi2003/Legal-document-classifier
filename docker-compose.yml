services:
  postgres:
    image: postgres:16
    container_name: legal-document-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_documents

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: legal-document-backend
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/legal_documents
      SOFFICE_PATH: /usr/bin/soffice
      JWT_SECRET: ${JWT_SECRET}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:5173}
      SHAREPOINT_ENABLED: ${SHAREPOINT_ENABLED:-false}
      SHAREPOINT_TENANT_ID: ${SHAREPOINT_TENANT_ID:-}
      SHAREPOINT_CLIENT_ID: ${SHAREPOINT_CLIENT_ID:-}
      SHAREPOINT_CLIENT_SECRET: ${SHAREPOINT_CLIENT_SECRET:-}
      SHAREPOINT_DRIVE_ID: ${SHAREPOINT_DRIVE_ID:-}
      SHAREPOINT_INBOX_FOLDER_ID: ${SHAREPOINT_INBOX_FOLDER_ID:-}
      SHAREPOINT_USER_MAP: ${SHAREPOINT_USER_MAP:-}

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: legal-document-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    environment:
      VITE_WS_URL: ${VITE_WS_URL:-}
      VITE_SHAREPOINT_UPLOAD_URL: ${VITE_SHAREPOINT_UPLOAD_URL:-}

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_uploads:
  frontend_node_modules:
  backend_node_modules:
